%YAML 1.2
---
$id: http://devicetree.org/schemas/media/hisilicon,hi3798mv320-venc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV320 VEDU H.264 video encoder

maintainers:
  - HELPMEEADICE <yuanzhenpeng210@gmail.com>

properties:
  compatible:
    const: hisilicon,hi3798mv320-venc

  reg:
    maxItems: 1
    description: VEDU registers including the private SMMU at offset 0xf000.

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description: The combined encoder core, AXI and private SMMU gates.

  resets:
    items:
      - description: VEDU core reset
      - description: Private SMMU reset

  reset-names:
    items:
      - const: core
      - const: smmu

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - reset-names

additionalProperties: false
